<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MyDantec</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --brand: #00aff0; --bg: #ffffff; --text: #1a1a1b; --sidebar-bg: #f8f9fa;
            --bubble-me: #00aff0; --bubble-other: #f1f0f0; --input-bg: #f1f3f4;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --text: #f8fafc; --sidebar-bg: #1e293b;
            --bubble-me: #38bdf8; --bubble-other: #334155; --input-bg: #334155;
        }
        
        /* Utilisation de dvh pour éviter que ça descende dans le vide */
        body, html { 
            margin: 0; padding: 0; 
            height: 100dvh; width: 100%; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); color: var(--text); 
            overflow: hidden; 
            position: fixed; /* Empêche le rebond élastique sur iOS */
        }

        #auth-screen { 
            position: fixed; inset: 0; background: #0f172a; 
            z-index: 2000; display: flex; justify-content: center; align-items: center; 
        }
        .auth-box { 
            background: #1e293b; padding: 30px; border-radius: 24px; 
            width: 85%; max-width: 400px; text-align: center; color: white;
        }

        #app { display: none; height: 100dvh; width: 100%; flex-direction: row; }

        .sidebar { 
            width: 350px; height: 100dvh; background: var(--sidebar-bg); 
            border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; 
        }

        .chat-area { 
            flex: 1; height: 100dvh; display: flex; flex-direction: column; 
            background: var(--bg); position: relative; 
        }

        @media (max-width: 768px) {
            .sidebar { position: absolute; width: 100%; left: 0; z-index: 100; transition: 0.3s; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
        }

        .header { 
            height: 60px; padding: 0 20px; display: flex; align-items: center; 
            justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); 
            flex-shrink: 0;
        }

        /* Zone de messages qui prend tout l'espace restant */
        #msg-container { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 10px;
            -webkit-overflow-scrolling: touch;
        }

        .footer { 
            padding: 10px 15px; 
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* Support iPhone Notch */
            display: flex; gap: 10px; align-items: center;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: var(--bg);
            flex-shrink: 0;
        }

        .input-bar { 
            flex: 1; background: var(--input-bg); border-radius: 25px; 
            padding: 0 15px; display: flex; align-items: center;
        }
        
        #msgIn { 
            width: 100%; border: none; background: transparent; 
            height: 40px; outline: none; color: var(--text); font-size: 16px; 
        }

        /* Bouton Retour */
        .back-button {
            display: none; background: var(--input-bg); border: none; 
            padding: 8px 12px; border-radius: 10px; font-weight: bold; 
            color: var(--brand); margin-right: 10px;
        }
        @media (max-width: 768px) { .back-button { display: block; } }

        .bubble { max-width: 80%; padding: 10px 15px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
        .me { align-self: flex-end; background: var(--brand); color: white; border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 4px; }

        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; background: #334155; color: white; box-sizing: border-box; }
        .btn-blue { background: var(--brand); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="margin:0 0 20px 0; color: var(--brand);">MyDantec</h2>
        <input type="text" id="userIn" class="auth-input" placeholder="Pseudo">
        <input type="password" id="passIn" class="auth-input" placeholder="Mot de passe">
        <button class="btn-blue" onclick="auth('login')">Se connecter</button>
        <p style="font-size: 13px; margin-top: 15px; opacity: 0.7;" onclick="auth('signup')">Pas de compte ? <span style="color:var(--brand); cursor:pointer">S'inscrire</span></p>
    </div>
</div>

<div id="app">
    <div class="sidebar" id="sidebar">
        <div class="header">
            <b>MyDantec</b>
            <span style="cursor:pointer" onclick="toggleTheme()">🌓</span>
        </div>
        <div style="padding: 15px;">
            <div style="background:var(--input-bg); border-radius:10px; display:flex; padding:5px;">
                <input type="text" id="friendIn" placeholder="Ami..." style="flex:1; border:none; background:transparent; outline:none; padding:8px; color:var(--text)">
                <button onclick="sendRequest()" style="background:var(--brand); border:none; color:white; border-radius:8px; width:35px; cursor:pointer">+</button>
            </div>
        </div>
        <div id="request-area"></div>
        <div id="friend-list" style="flex:1; overflow-y:auto;"></div>
    </div>

    <div class="chat-area">
        <div class="header">
            <div style="display:flex; align-items:center">
                <button class="back-button" onclick="setSidebar(true)">←</button>
                <b id="targetName">Chat</b>
            </div>
        </div>
        <div id="msg-container"></div>
        <div class="footer">
            <div class="input-bar">
                <input type="text" id="msgIn" placeholder="Message..." onkeydown="if(event.key==='Enter') send()">
            </div>
            <button onclick="send()" style="background:var(--brand); color:white; border:none; width:40px; height:40px; border-radius:50%; flex-shrink:0;">➔</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let me = "", target = "", onlineUsers = [];

    // Empêche le scroll du body pour fixer le clavier
    window.addEventListener('resize', () => {
        if (document.activeElement.tagName === 'INPUT') {
            window.scrollTo(0,0);
            document.body.scrollTop = 0;
        }
    });

    function toggleTheme() {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    if(localStorage.getItem('theme')) document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));

    function setSidebar(show) {
        const sb = document.getElementById('sidebar');
        show ? sb.classList.remove('hidden') : sb.classList.add('hidden');
    }

    async function auth(type) {
        const username = document.getElementById('userIn').value;
        const password = document.getElementById('passIn').value;
        if(!username) return;
        const res = await fetch('/' + type, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if(data.success) {
            me = username;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            socket.emit('registerUser', me);
            updateUI();
            setInterval(updateUI, 5000);
        } else alert(data.error);
    }

    async function sendRequest() {
        const to = document.getElementById('friendIn').value;
        if(!to || to === me) return;
        const res = await fetch('/send-request', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({from: me, to})
        });
        const data = await res.json();
        if(data.success) { alert("Envoyé !"); document.getElementById('friendIn').value = ""; } 
        else alert(data.error);
    }

    async function handleReq(friend, action) {
        await fetch(`/${action}-request`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({me, friend}) });
        updateUI();
    }

    async function updateUI() {
        const res = await fetch(`/user-data/${me}`);
        const data = await res.json();
        const reqArea = document.getElementById('request-area');
        reqArea.innerHTML = data.requests.map(r => `
            <div style="background:rgba(0,175,240,0.1); padding:10px; display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px"><b>${r}</b> ?</span>
                <div style="display:flex; gap:5px">
                    <button onclick="handleReq('${r}','accept')" style="border:none; background:none;">✅</button>
                    <button onclick="handleReq('${r}','decline')" style="border:none; background:none;">❌</button>
                </div>
            </div>
        `).join('');

        document.getElementById('friend-list').innerHTML = data.friends.map(f => `
            <div style="padding:15px; display:flex; align-items:center; cursor:pointer; border-bottom:1px solid rgba(0,0,0,0.02)" onclick="selectChat('${f}')">
                <div style="width:8px; height:8px; border-radius:50%; margin-right:10px; background:${onlineUsers.includes(f) ? '#10b981' : '#cbd5e1'}"></div>
                <span style="font-weight:600">${f}</span>
            </div>
        `).join('');
    }

    async function selectChat(name) {
        target = name;
        document.getElementById('targetName').innerText = target;
        setSidebar(false);
        const res = await fetch(`/messages/${me}/${target}`);
        const msgs = await res.json();
        const container = document.getElementById('msg-container');
        container.innerHTML = '';
        msgs.forEach(display);
    }

    function display(msg) {
        if((msg.from === me && msg.to === target) || (msg.from === target && msg.to === me)) {
            const container = document.getElementById('msg-container');
            const div = document.createElement('div');
            div.className = `bubble ${msg.from === me ? 'me' : 'other'}`;
            div.innerText = msg.text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    }

    function send() {
        const el = document.getElementById('msgIn');
        if(!el.value || !target) return;
        socket.emit('sendMessage', { from: me, to: target, text: el.value });
        el.value = "";
    }

    socket.on('receiveMessage', display);
    socket.on('onlineUpdate', users => { onlineUsers = users; updateUI(); });
</script>
</body>
</html>
