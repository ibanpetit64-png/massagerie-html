<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyDantec</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png"> <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --brand: #00aff0; --bg: #ffffff; --text: #1a1a1b; --sidebar-bg: #f8f9fa;
            --bubble-me: #00aff0; --bubble-other: #f1f0f0; --input-bg: #f1f3f4;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --text: #f8fafc; --sidebar-bg: #1e293b;
            --bubble-me: #38bdf8; --bubble-other: #334155; --input-bg: #334155;
        }
        
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

        /* PAGE DE CONNEXION ÉPURÉE */
        #auth-screen { 
            position: fixed; inset: 0; 
            background: #0f172a; 
            z-index: 2000; display: flex; justify-content: center; align-items: center; 
        }
        .auth-box { 
            background: #1e293b; padding: 40px 30px; border-radius: 24px; 
            width: 90%; max-width: 400px; text-align: center; color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* NAVIGATION */
        #app { display: none; height: 100dvh; width: 100%; flex-direction: row; }
        .sidebar { width: 350px; height: 100%; background: var(--sidebar-bg); border-right: 1px solid rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: 0.3s; z-index: 100; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }

        @media (max-width: 768px) {
            .sidebar { position: absolute; width: 100%; left: 0; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { position: absolute; width: 100%; left: 0; }
        }

        .header { padding: 10px 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0,0,0,0.05); background: var(--bg); box-sizing: border-box; }

        /* BOUTON RETOUR MOBILE */
        .back-button {
            display: none; background: var(--input-bg); border: none; 
            padding: 8px 15px; border-radius: 10px; cursor: pointer;
            font-weight: bold; color: var(--brand); margin-right: 15px;
        }
        @media (max-width: 768px) { .back-button { display: block; } }

        /* MESSAGES & INPUTS */
        #msg-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 15px; }
        .me { align-self: flex-end; background: var(--brand); color: white; border-bottom-right-radius: 4px; }
        .other { align-self: flex-start; background: var(--bubble-other); color: var(--text); border-bottom-left-radius: 4px; }

        .footer { padding: 15px; display: flex; gap: 10px; border-top: 1px solid rgba(0,0,0,0.05); }
        .input-bar { flex: 1; background: var(--input-bg); border-radius: 25px; padding: 5px 20px; }
        #msgIn { width: 100%; border: none; background: transparent; padding: 10px 0; outline: none; color: var(--text); font-size: 16px; }

        .auth-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: none; background: #334155; color: white; outline: none; box-sizing: border-box; }
        .btn-blue { background: var(--brand); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2 style="margin-top:0; color: var(--brand);">MyDantec</h2>
        <input type="text" id="userIn" class="auth-input" placeholder="Pseudo">
        <input type="password" id="passIn" class="auth-input" placeholder="Mot de passe">
        <button class="btn-blue" onclick="auth('login')">Se connecter</button>
        <p style="font-size: 13px; margin-top: 15px; opacity: 0.7;" onclick="auth('signup')">Pas de compte ? <span style="color:var(--brand); cursor:pointer">S'inscrire</span></p>
    </div>
</div>

<div id="app">
    <div class="sidebar" id="sidebar">
        <div class="header">
            <b style="font-size: 18px;">MyDantec</b>
            <span style="cursor:pointer" onclick="toggleTheme()">🌓</span>
        </div>
        <div style="padding: 15px;">
            <div style="background:var(--input-bg); border-radius:10px; display:flex; padding:5px 10px;">
                <input type="text" id="friendIn" placeholder="Ajouter un ami..." style="flex:1; border:none; background:transparent; outline:none; padding:8px; color:var(--text)">
                <button onclick="sendRequest()" style="background:var(--brand); border:none; color:white; border-radius:8px; width:30px; cursor:pointer">+</button>
            </div>
        </div>
        <div id="request-area"></div>
        <div id="friend-list" style="flex:1; overflow-y:auto;"></div>
    </div>

    <div class="chat-area">
        <div class="header">
            <div style="display:flex; align-items:center">
                <button class="back-button" onclick="setSidebar(true)">← Retour</button>
                <b id="targetName">Chat</b>
            </div>
        </div>
        <div id="msg-container"></div>
        <div class="footer">
            <div class="input-bar">
                <input type="text" id="msgIn" placeholder="Écrire un message..." onkeydown="if(event.key==='Enter') send()">
            </div>
            <button onclick="send()" style="background:var(--brand); color:white; border:none; width:45px; height:45px; border-radius:50%; cursor:pointer">➔</button>
        </div>
    </div>
</div>

<script>
    /* Le script reste le même pour faire fonctionner la messagerie */
    const socket = io();
    let me = "", target = "", onlineUsers = [];

    function toggleTheme() {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    if(localStorage.getItem('theme')) document.documentElement.setAttribute('data-theme', localStorage.getItem('theme'));

    function setSidebar(show) {
        const sb = document.getElementById('sidebar');
        show ? sb.classList.remove('hidden') : sb.classList.add('hidden');
    }

    async function auth(type) {
        const username = document.getElementById('userIn').value;
        const password = document.getElementById('passIn').value;
        const res = await fetch('/' + type, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if(data.success) {
            me = username;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            socket.emit('registerUser', me);
            updateUI();
            setInterval(updateUI, 5000);
        } else alert(data.error);
    }

    async function updateUI() {
        const res = await fetch(`/user-data/${me}`);
        const data = await res.json();
        document.getElementById('friend-list').innerHTML = data.friends.map(f => `
            <div style="padding:15px 20px; display:flex; align-items:center; cursor:pointer; border-bottom:1px solid rgba(0,0,0,0.02)" onclick="selectChat('${f}')">
                <div style="width:10px; height:10px; border-radius:50%; margin-right:12px; background:${onlineUsers.includes(f) ? '#10b981' : '#cbd5e1'}"></div>
                <span style="font-weight:600">${f}</span>
            </div>
        `).join('');
    }

    async function selectChat(name) {
        target = name;
        document.getElementById('targetName').innerText = target;
        setSidebar(false);
        const res = await fetch(`/messages/${me}/${target}`);
        const msgs = await res.json();
        const container = document.getElementById('msg-container');
        container.innerHTML = '';
        msgs.forEach(display);
    }

    function display(msg) {
        if((msg.from === me && msg.to === target) || (msg.from === target && msg.to === me)) {
            const container = document.getElementById('msg-container');
            const div = document.createElement('div');
            div.className = `bubble ${msg.from === me ? 'me' : 'other'}`;
            div.innerText = msg.text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    }

    function send() {
        const el = document.getElementById('msgIn');
        if(!el.value || !target) return;
        socket.emit('sendMessage', { from: me, to: target, text: el.value });
        el.value = "";
    }

    socket.on('receiveMessage', display);
    socket.on('onlineUpdate', users => { onlineUsers = users; updateUI(); });
</script>
</body>
</html>
